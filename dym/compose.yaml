services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                NODE_VERSION: '24'
        image: dym-sail/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-8000}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: 'client_host=host.docker.internal'
        volumes:
            - '.:/var/www/html'
            - type: volume
              source: node_modules
              target: /var/www/html/node_modules
              volume:
                  nocopy: true
        networks:
            - sail

    vite:
        image: dym-sail/app
        command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0', '--port', '5173', '--strictPort']
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: root
        ports:
            - '127.0.0.1:5173:5173'
        volumes:
            - '.:/var/www/html'
            - type: volume
              source: node_modules
              target: /var/www/html/node_modules
              volume:
                  nocopy: true
        depends_on:
            - laravel.test
        networks:
            - sail

    queue:
        image: dym-sail/app
        command: ['php', 'artisan', 'queue:listen', '--tries=1', '--timeout=90']
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - type: volume
              source: node_modules
              target: /var/www/html/node_modules
              volume:
                  nocopy: true
        depends_on:
            - laravel.test
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    node_modules:
