name: Deploy Git Mirror (LWS)

# Manuel : le déploiement automatique passe par deploy.yml (FTP).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create build .env
        working-directory: dym
        run: cp .env.example .env

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl

      - name: Install Composer dependencies
        working-directory: dym
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dym/package-lock.json

      - name: Build frontend assets
        working-directory: dym
        run: npm ci && npm run build

      - name: Prepare storage directories
        working-directory: dym
        run: |
          mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache/data storage/logs
          touch storage/framework/views/.gitkeep
          touch storage/framework/sessions/.gitkeep
          touch storage/framework/cache/data/.gitkeep
          touch storage/logs/.gitkeep

      - name: Push built application to deploy branch
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          rm -f dym/.env
          rm -rf dym/node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # La branche deploy reproduit le contenu de dym/ à sa racine pour
          # correspondre directement à public_html/dym-website sur LWS.
          export GIT_INDEX_FILE="$RUNNER_TEMP/deploy.index"
          git read-tree --empty
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE/dym" -C "$GITHUB_WORKSPACE/dym" add -A -- .
          # Les workflows du dépôt ne font pas partie de l'application LWS.
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE/dym" -C "$GITHUB_WORKSPACE/dym" rm -r --cached --ignore-unmatch .github
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE/dym" -C "$GITHUB_WORKSPACE/dym" add -f -- vendor public/build
          DEPLOY_TREE=$(git write-tree)
          DEPLOY_COMMIT=$(printf 'deploy: build %s %s\n' "${GITHUB_SHA::7}" "$(date -u +%FT%TZ)" | git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit-tree "$DEPLOY_TREE")
          rm -f "$GIT_INDEX_FILE"
          unset GIT_INDEX_FILE
          git push --force origin "$DEPLOY_COMMIT:refs/heads/deploy"

      - name: Trigger LWS git-mirror deploy
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_TOKEN" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL et DEPLOY_WEBHOOK_TOKEN doivent être configurés."
            exit 1
          fi
          python3 - "$WEBHOOK_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = urlparse(sys.argv[1])
          if url.scheme != "https" or not url.hostname or url.path.rstrip("/") != "/api/deploy" or url.query or url.fragment:
              raise SystemExit("DEPLOY_WEBHOOK_URL doit être exactement https://dym.ci/api/deploy (sans guillemets ni paramètres).")
          PY
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/deploy_out.txt -X POST \
            "${WEBHOOK_URL%/}/git" \
            -H "X-Deploy-Token: $WEBHOOK_TOKEN" \
            -H "Accept: application/json" \
            --max-time 180 --retry 2 --retry-delay 5)
          echo "HTTP $HTTP_CODE"
          python3 -m json.tool /tmp/deploy_out.txt 2>/dev/null || head -c 2000 /tmp/deploy_out.txt
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::Route de déploiement introuvable : dym.ci sert encore l'ancienne application (bascule du dossier non faite) (voir dym/DEPLOYMENT.md, « Première installation »)."
          fi
          [ "$HTTP_CODE" -lt 400 ] || { echo "Git-mirror webhook failed with HTTP $HTTP_CODE"; exit 1; }

      - name: Check site
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null --max-time 20 https://dym.ci/up; then echo "https://dym.ci/up OK"; exit 0; fi
            sleep 10
          done
          echo "::error::https://dym.ci/up ne répond pas après le déploiement."
          exit 1
