name: Deploy via FTP (LWS)

# Déploiement automatique à chaque push sur main (et lançable à la main).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_upload:
        description: 'Tout renvoyer (ignorer le manifeste du serveur)'
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dym

    steps:
      - uses: actions/checkout@v4

      - name: Create build .env
        run: cp .env.example .env

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dym/package-lock.json

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Prepare storage directories
        run: |
          mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache/data storage/logs
          touch storage/framework/views/.gitkeep
          touch storage/framework/sessions/.gitkeep
          touch storage/framework/cache/data/.gitkeep
          touch storage/logs/.gitkeep

      - name: Install lftp
        run: sudo apt-get install -y -qq lftp >/dev/null

      # Envoi incrémental : un manifeste (empreinte SHA-1 de chaque fichier) est
      # conservé sur le serveur ; seuls les fichiers modifiés sont envoyés, sur
      # 8 connexions en parallèle, avec reconnexion automatique. Un envoi
      # interrompu se reprend au run suivant (le manifeste n'est écrit qu'à la fin).
      - name: Deploy to LWS via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # Lu par « open --env-password » : le mot de passe n'apparaît dans aucune commande.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Le compte FTP LWS s'ouvre directement dans public_html/dym-website.
          FTP_DIR: ${{ vars.FTP_SERVER_DIR || '.' }}
          FULL_UPLOAD: ${{ inputs.full_upload || 'false' }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"

          # Fichiers utiles en production : sources front, tests, docs et contenu
          # de storage/ exclus (seule l'arborescence de storage/ est envoyée).
          {
            find . \( -path ./node_modules -o -path ./tests -o -path ./resources/js -o -path ./resources/css \
                      -o -path ./docker -o -path './linea terra' -o -path ./.github -o -path ./.git \
                      -o -path ./storage -o -path ./public/storage -o -path ./bootstrap/cache \) -prune \
                 -o -type f ! -name '.env*' ! -name '*.md' ! -path ./public/hot -printf '%P\0'
            find storage bootstrap/cache -type f \( -name .gitkeep -o -name .gitignore \) -printf '%p\0'
          } | sort -z | xargs -0 sha1sum | sed -E 's/^([0-9a-f]{40}) [ *]/\1|/' >"$T/local.manifest"
          echo "$(wc -l < "$T/local.manifest") fichiers suivis"

          # Certificat FTPS de l'hébergement mutualisé émis pour le nom du serveur,
          # pas pour ftp.dym-manufacture.com : chiffré, mais non vérifié.
          cat > "$T/settings.lftp" <<'LFTP'
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set xfer:clobber true
          LFTP

          : > "$T/remote.manifest"
          if [ "$FULL_UPLOAD" = "true" ]; then
            echo "Envoi complet demandé : manifeste distant ignoré."
          else
            lftp -e "source '$T/settings.lftp'; set net:max-retries 2; open --env-password -u '$FTP_USERNAME' '$FTP_SERVER'; get '$FTP_DIR/.deploy-manifest' -o '$T/remote.manifest'; bye" \
              || echo "Pas de manifeste distant : envoi complet."
          fi

          # FILENAME et non NR==FNR : ce dernier se trompe quand le premier fichier est vide.
          awk -F'|' 'FILENAME == ARGV[1] { r[$2] = $1; next } r[$2] != $1 { print $2 }' "$T/remote.manifest" "$T/local.manifest" > "$T/changed"
          awk -F'|' 'FILENAME == ARGV[1] { l[$2] = 1; next } !($2 in l) { print $2 }' "$T/local.manifest" "$T/remote.manifest" > "$T/deleted"
          echo "$(wc -l < "$T/changed") fichier(s) à envoyer, $(wc -l < "$T/deleted") à supprimer"
          if [ ! -s "$T/remote.manifest" ] && [ ! -s "$T/changed" ]; then
            echo "::error::Aucun manifeste distant mais rien à envoyer : comparaison incohérente."; exit 1
          fi

          mkdir -p "$T/stage"
          rsync -a --files-from="$T/changed" ./ "$T/stage/"

          {
            echo "source '$T/settings.lftp'"
            echo "set cmd:fail-exit true"
            echo "open --env-password -u '$FTP_USERNAME' '$FTP_SERVER'"
            echo "mirror -R --parallel=8 --transfer-all --no-perms --no-umask '$T/stage/' '$FTP_DIR'"
            echo "set cmd:fail-exit false"
            echo "cd '$FTP_DIR'"
            sed 's/"/\\"/g; s/.*/rm -f "&"/' "$T/deleted"
            # Caches Laravel (config, routes, paquets) d'une version précédente ou de
            # l'ancienne application : supprimés, ils sont régénérés au besoin.
            echo "rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/events.php bootstrap/cache/packages.php bootstrap/cache/services.php"
            echo "set cmd:fail-exit true"
            echo "put '$T/local.manifest' -o .deploy-manifest"
            echo "bye"
          } > "$T/sync.lftp"

          lftp -f "$T/sync.lftp"

      - name: Run post-deploy commands
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_TOKEN" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL et DEPLOY_WEBHOOK_TOKEN doivent être configurés."
            exit 1
          fi
          python3 - "$WEBHOOK_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = urlparse(sys.argv[1])
          if url.scheme != "https" or not url.hostname or url.path.rstrip("/") != "/api/deploy" or url.query or url.fragment:
              raise SystemExit("DEPLOY_WEBHOOK_URL doit être exactement https://dym.ci/api/deploy (sans guillemets ni paramètres).")
          PY
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/deploy_out.txt -X POST \
            "${WEBHOOK_URL%/}" \
            -H "X-Deploy-Token: $WEBHOOK_TOKEN" \
            -H "Accept: application/json" \
            --max-time 180 --retry 2 --retry-delay 5)
          echo "HTTP $HTTP_CODE"
          python3 -m json.tool /tmp/deploy_out.txt 2>/dev/null || head -c 2000 /tmp/deploy_out.txt
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::Route de déploiement introuvable : dym.ci sert encore l'ancienne application (bascule du dossier non faite) (voir dym/DEPLOYMENT.md, « Première installation »)."
          fi
          [ "$HTTP_CODE" -lt 400 ] || { echo "Post-deploy webhook failed with HTTP $HTTP_CODE"; exit 1; }
