name: Deploy via FTP (LWS)

# Secours manuel : le déploiement automatique passe par deploy-git-mirror.yml.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dym

    steps:
      - uses: actions/checkout@v4

      - name: Create build .env
        run: cp .env.example .env

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, intl

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dym/package-lock.json

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Prepare storage directories
        run: |
          mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache/data storage/logs
          touch storage/framework/views/.gitkeep
          touch storage/framework/sessions/.gitkeep
          touch storage/framework/cache/data/.gitkeep
          touch storage/logs/.gitkeep

      - name: Deploy to LWS via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dym/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/dym-website' }}/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/.env.example
            **/README.md
            **/phpunit.xml
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/*.php

      - name: Run post-deploy commands
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_TOKEN" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL et DEPLOY_WEBHOOK_TOKEN doivent être configurés."
            exit 1
          fi
          python3 - "$WEBHOOK_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = urlparse(sys.argv[1])
          if url.scheme != "https" or not url.hostname or url.path.rstrip("/") != "/api/deploy" or url.query or url.fragment:
              raise SystemExit("DEPLOY_WEBHOOK_URL doit être exactement https://dym.ci/api/deploy (sans guillemets ni paramètres).")
          PY
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/deploy_out.txt -X POST \
            "${WEBHOOK_URL%/}" \
            -H "X-Deploy-Token: $WEBHOOK_TOKEN" \
            -H "Accept: application/json" \
            --max-time 180 --retry 2 --retry-delay 5)
          echo "HTTP $HTTP_CODE"
          cat /tmp/deploy_out.txt | python3 -m json.tool 2>/dev/null || cat /tmp/deploy_out.txt
          [ "$HTTP_CODE" -lt 400 ] || { echo "Post-deploy webhook failed with HTTP $HTTP_CODE"; exit 1; }
