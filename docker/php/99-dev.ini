; Le code est monté depuis Windows (montage 9p de WSL2), où chaque stat() est
; très lent : OPcache ne revérifie plus les fichiers PHP entre deux requêtes.
; Après modification d'un fichier PHP : docker compose restart laravel.test
; (ou PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 dans .env pour revenir au comportement
; par défaut, plus lent).
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.max_accelerated_files=30000
opcache.memory_consumption=256
